espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
navigationCompose = "2.9.8"
camera = "1.6.2"
mlkitBarcode = "17.3.0"
retrofit = "3.0.0"
okhttp = "4.12.0"
lifecycleCompose = "2.9.4"
coil = "2.7.0"
room = "2.8.5"
datastore = "1.2.1"
ksp = "2.3.10"

[libraries]
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
